spring:
  application:
    name: bucky-improvement
  datasource:
    # 本机源码编译的 PostgreSQL（~/local/pgsql-17，见第 05 课），库名 bucky。用户名默认是当前系统用户，本机连接不需要密码
    url: ${BUCKY_DB_URL:jdbc:postgresql://localhost:5432/bucky}
    username: ${BUCKY_DB_USER:${USER}}
    password: ${BUCKY_DB_PASSWORD:}
  threads:
    virtual:
      enabled: true   # Java 21 虚拟线程：每个 HTTP 请求跑在虚拟线程上，调用大模型这种“长时间等待”的请求不会占满线程池
  ai:
    deepseek:
      # 连接配置：密钥从环境变量读，不要把密钥写进代码仓库
      api-key: ${DEEPSEEK_API_KEY}
      # base-url 不写，默认就是 https://api.deepseek.com
      chat:
        # 模型参数：自动配置把这些值做成默认选项，每次调用都会带上
        model: deepseek-v4-flash   # 快且便宜；需要更强推理时换 deepseek-v4-pro
        max-tokens: 1024           # 单次回答最多生成多少 token，防止回答过长、费用失控
        thinking:                  # 默认关闭思考：日常问答更快更省；需要时在单次调用里打开（见第 03 课）
          type: disabled

server:
  port: 8080

logging:
  level:
    # SimpleLoggerAdvisor 用 DEBUG 打日志，默认 INFO 看不到，这里单独打开
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
